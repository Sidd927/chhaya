<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="520" fill="#0d0a08"/>
  <style>
    .box { fill: #17110d; stroke: #5a4636; stroke-width: 1.2; }
    .hot { fill: #241810; stroke: #f2b866; stroke-width: 1.4; }
    .t { fill: #f3e7d3; font-size: 15px; font-weight: 700; }
    .s { fill: #c9b79c; font-size: 12px; }
    .h { fill: #f2b866; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; }
    .a { stroke: #c9b79c; stroke-width: 1.4; fill: none; marker-end: url(#arr); }
  </style>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c9b79c"/></marker></defs>

  <text x="32" y="40" class="h">QUEST BROWSER · WEBXR IMMERSIVE-AR</text>

  <rect x="32" y="64" width="190" height="86" rx="8" class="box"/>
  <text x="48" y="92" class="t">Hand tracking</text>
  <text x="48" y="114" class="s">25 joints × 2 hands</text>
  <text x="48" y="132" class="s">XRFrame.getJointPose</text>

  <rect x="32" y="170" width="190" height="86" rx="8" class="box"/>
  <text x="48" y="198" class="t">Plane detection</text>
  <text x="48" y="220" class="s">semanticLabel = wall</text>
  <text x="48" y="238" class="s">head-gaze ray + pinch</text>

  <rect x="32" y="276" width="190" height="86" rx="8" class="box"/>
  <text x="48" y="304" class="t">Persistent anchors</text>
  <text x="48" y="326" class="s">createAnchor · handle</text>
  <text x="48" y="344" class="s">restorePersistentAnchor</text>

  <rect x="32" y="382" width="190" height="86" rx="8" class="box"/>
  <text x="48" y="410" class="t">Passthrough</text>
  <text x="48" y="432" class="s">alpha-blend compositing</text>
  <text x="48" y="450" class="s">theater dimming</text>

  <rect x="290" y="64" width="250" height="404" rx="10" class="hot"/>
  <text x="310" y="94" class="h">TheaterSystem (IWSDK ECS)</text>
  <text x="310" y="126" class="t">Hands</text>
  <text x="310" y="146" class="s">pinch · stillness · shape → species</text>
  <text x="310" y="182" class="t">Stage + magic lantern</text>
  <text x="310" y="202" class="s">wall frame · focal projection</text>
  <text x="310" y="238" class="t">Creatures</text>
  <text x="310" y="258" class="s">frozen hand silhouettes, 2D gaits</text>
  <text x="310" y="294" class="t">Tale director</text>
  <text x="310" y="314" class="s">beats · waits · assists</text>
  <text x="310" y="350" class="t">Light buttons</text>
  <text x="310" y="370" class="s">press by covering with shadow</text>
  <text x="310" y="406" class="t">Save</text>
  <text x="310" y="426" class="s">localStorage: shadows, tales, anchor</text>

  <rect x="606" y="64" width="322" height="120" rx="8" class="box"/>
  <text x="624" y="92" class="t">Shadow layer</text>
  <text x="624" y="114" class="s">SDF capsules → 1024×640 RGBA8, MAX blend</text>
  <text x="624" y="134" class="s">R coverage · G depth · B eyes · A ember</text>
  <text x="624" y="154" class="s">one instanced draw, mipmapped</text>

  <rect x="606" y="206" width="322" height="120" rx="8" class="box"/>
  <text x="624" y="234" class="t">Wall shader</text>
  <text x="624" y="256" class="s">lantern irradiance + pool of light</text>
  <text x="624" y="276" class="s">contact-hardening penumbra from mips</text>
  <text x="624" y="296" class="s">ink / light over passthrough</text>

  <rect x="606" y="348" width="322" height="120" rx="8" class="box"/>
  <text x="624" y="376" class="t">Text, lantern, sound</text>
  <text x="624" y="398" class="s">canvas type (Fraunces, Manrope)</text>
  <text x="624" y="418" class="s">procedural paper lantern</text>
  <text x="624" y="438" class="s">WebAudio drone + HRTF creature calls</text>

  <path d="M222 107 H284" class="a"/>
  <path d="M222 213 H284" class="a"/>
  <path d="M222 319 H284" class="a"/>
  <path d="M540 124 H600" class="a"/>
  <path d="M767 184 V200" class="a"/>
  <path d="M540 408 H600" class="a"/>
  <path d="M606 266 C 470 300 260 400 222 425" class="a"/>
</svg>
